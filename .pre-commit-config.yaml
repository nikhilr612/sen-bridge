# Install with `pre-commit install`. Local hooks use the project's pinned tools.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format --check
        entry: .venv/bin/ruff format --check
        language: system
        types: [python]
      - id: ruff
        name: ruff check
        entry: .venv/bin/ruff check
        language: system
        types: [python]
      - id: ty
        name: ty check
        entry: .venv/bin/ty check
        language: system
        types: [python]
        pass_filenames: false
