[project]
name = "sen-bridge"
version = "0.1.0"
description = "SEN-Bridge: SAR-to-optical flow matching dataset build code and metrics"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pillow", "pandas", "pyarrow"]

[project.optional-dependencies]
torch = ["torch", "safetensors"]
jax = ["jax", "flax", "safetensors"]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sen_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
